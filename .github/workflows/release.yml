name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  api-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the deployed API
        env:
          API_URL: ${{ vars.ANIME_API_URL }}
        run: python3 scripts/check-api.py "$API_URL"
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: brew install lua
      - run: make test
      - name: Build native archive
        env:
          API_URL: ${{ vars.ANIME_API_URL }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python3 scripts/build-release.py --version "$RELEASE_VERSION" --api-url "$API_URL" --arch "$RELEASE_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
  formula:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksummed formula
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/generate-formula.py --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-formula
          path: dist/anime.rb
  install-test:
    needs: formula
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate local test formula using the exact release archives
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/generate-formula.py --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --asset-base "file://$PWD/dist" --output dist/local-anime.rb
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          brew tap-new anime/install-check
          cp dist/local-anime.rb "$(brew --repository anime/install-check)/Formula/anime.rb"
          brew install anime/install-check/anime
          brew test anime/install-check/anime
          cd /tmp
          anime --help
          anime --version
  publish:
    needs: [install-test, api-health]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish verified assets and formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" dist/*.tar.gz dist/anime.rb --generate-notes
  tap:
    needs: publish
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-formula
          path: dist
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the tap after successful install tests
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Formula
          cp dist/anime.rb tap/Formula/anime.rb
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/anime.rb
          if ! git diff --cached --quiet; then
            git commit -m "anime $RELEASE_VERSION"
            git push
          fi
